[package]
name = "hanafubuki-agent-model-api"
description = "Model provider protocols for hanafubuki-agent: requests, streaming and tool-call lowering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
hanafubuki-agent-foundation.workspace = true
hanafubuki-agent-tool-contracts.workspace = true
base64.workspace = true
bytes = "1"
futures-util.workspace = true
log.workspace = true
reqwest = { workspace = true, features = ["json", "rustls", "socks", "stream", "system-proxy"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[[test]]
name = "fake_contract"
required-features = ["test-support"]
