[package]
name = "hanafubuki-agent-plugin-execution"
description = "The hanafubuki-agent plugin for command execution tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hanafubuki-agent-contracts.workspace = true
hanafubuki-agent-execution.workspace = true
hanafubuki-agent-approval.workspace = true
hanafubuki-agent-foundation.workspace = true
hanafubuki-agent-sandbox.workspace = true
hanafubuki-agent-tool-contracts.workspace = true
kardia-core.workspace = true
log.workspace = true
serde_json.workspace = true

[dev-dependencies]
hanafubuki-agent-execution = { workspace = true, features = ["test-support"] }
hanafubuki-agent-approval = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
