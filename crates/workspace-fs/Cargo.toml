[package]
name = "hanafubuki-agent-workspace-fs"
description = "Workspace file access for hanafubuki-agent: reads, edits, search and atomic writes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
hanafubuki-agent-approval.workspace = true
hanafubuki-agent-foundation.workspace = true
getrandom = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "contracts"
required-features = ["test-support"]
