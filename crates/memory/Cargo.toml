[package]
name = "hanafubuki-agent-memory"
description = "Long-term memory for hanafubuki-agent: generation, consolidation and retrieval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hanafubuki-agent-foundation.workspace = true
hanafubuki-agent-model-api.workspace = true
hanafubuki-agent-tool-contracts.workspace = true
log.workspace = true
parking_lot.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }

[dev-dependencies]
hanafubuki-agent-model-api = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
