[package]
name = "hanafubuki-agent-mcp"
description = "Model Context Protocol client for hanafubuki-agent: servers, transports, OAuth and tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
async-trait = "0.1"
hanafubuki-agent-foundation.workspace = true
hanafubuki-agent-host.workspace = true
hanafubuki-agent-process.workspace = true
hanafubuki-agent-tool-contracts.workspace = true
base64.workspace = true
http.workspace = true
log.workspace = true
parking_lot.workspace = true
rmcp = { workspace = true, features = ["auth", "base64", "client", "elicitation", "reqwest", "schemars", "server", "transport-streamable-http-client-reqwest"] }
reqwest = { workspace = true, features = ["rustls", "socks", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror = "2"
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
url.workspace = true

[dev-dependencies]
hanafubuki-agent-process = { workspace = true, features = ["test-support"] }
axum.workspace = true
rmcp = { workspace = true, features = ["macros", "transport-streamable-http-server"] }
schemars = "1"
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
