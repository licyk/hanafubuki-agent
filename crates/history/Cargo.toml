[package]
name = "hanafubuki-agent-history"
description = "Conversation history for hanafubuki-agent: JSONL rollouts and their SQLite index"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hanafubuki-agent-kernel.workspace = true
hanafubuki-agent-foundation.workspace = true
chrono = "0.4"
image = { workspace = true, features = ["jpeg", "png"] }
log.workspace = true
parking_lot.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true
