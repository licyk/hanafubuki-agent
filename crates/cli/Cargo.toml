[package]
name = "hanafubuki-agent-cli"
description = "The hanafubuki-agent command line and terminal interface: the chat, exec, resume, the configuration, Providers, MCP servers, sessions and doctor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "../../README.md"

[[bin]]
name = "hanafubuki-agent"
path = "src/main.rs"

[dependencies]
hanafubuki-agent.workspace = true
hanafubuki-agent-tui.workspace = true
# `update`, the check at launch and the prompt.
hanafubuki-agent-update.workspace = true
# Session times in `sessions list`; the version the facade uses.
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "signal", "sync", "time"] }
# `config get` prints tables as TOML; the version the configuration uses.
toml = "1.1"
# `plugins validate --run` starts a plugin in a throwaway home.
tempfile.workspace = true
# `plugins dev` watches a plugin's directory; the version the facade uses.
notify = "8"

[dev-dependencies]
hanafubuki-agent = { workspace = true, features = ["test-support"] }
hanafubuki-agent-update = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
