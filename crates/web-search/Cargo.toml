[package]
name = "hanafubuki-agent-web-search"
description = "Web search and fetch providers for hanafubuki-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
ipnet = "2"
encoding_rs = "0.8"
uuid = { workspace = true, features = ["v4"] }
base64.workspace = true
regex.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
hanafubuki-agent-foundation.workspace = true
dom_query = "0.28"
futures-util.workspace = true
hex.workspace = true
log.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["brotli", "deflate", "form", "gzip", "json", "query", "rustls", "socks", "stream", "system-proxy"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "sync", "time"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
