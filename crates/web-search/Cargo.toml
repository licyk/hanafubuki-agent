[package]
name = "hanafubuki-agent-web-search"
description = "Web search and fetch providers for hanafubuki-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-support = []

[dependencies]
hanafubuki-agent-foundation.workspace = true
dom_query = "0.28"
futures-util.workspace = true
hex.workspace = true
log.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["brotli", "deflate", "form", "gzip", "json", "rustls", "socks", "stream", "system-proxy"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "net", "sync", "time"] }
url.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
