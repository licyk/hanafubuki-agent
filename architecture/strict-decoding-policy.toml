# Types that decode strictly, checked by `cargo xtask check-strict-decoding`.
#
# `deny_unknown_fields` follows the input source (AGENTS.md, "Decoding by
# input source"): a request a host's frontend sends over IPC (`ipc-request`)
# and a manifest we produce and check by digest (`integrity-manifest`) reject
# what they do not know; our persisted data, external producers and model
# output never do. `other` is security-relevant strictness that is neither,
# and its reason says why. A type with the attribute that is not listed
# fails, and so does an entry whose type no longer has it. `type` is the type
# name, qualified by inline modules.
version = 1

