# Size limits for Rust modules, checked by `cargo xtask check-module-size`.
#
# Counts are code lines: blank lines and comments are not counted. A limit
# asks for a review, not a split to fit the number. A module over its limit
# that is cohesive keeps an exception with the reason and the size it was
# reviewed at (`ceiling`); growing past the ceiling fails, and an exception
# that no longer applies must be removed.
version = 1

[limits]
production-file = 600
test-file = 900
production-function = 200

[[exceptions]]
path = "crates/kernel/src/activity.rs"
ceiling = 647
reason = "The activity tracker and the output preview it maintains; observe is an exhaustive event dispatch with no catch-all arm."

[[exceptions]]
path = "crates/agent/src/memory/supervisor.rs"
function = "run_memory_pass"
ceiling = 257
reason = "Over the limit when the limit was introduced; not yet reviewed for shortening."

[[exceptions]]
path = "crates/workspace-fs/src/resolver/prepare.rs"
function = "prepare_operation"
ceiling = 272
reason = "Over the limit when the limit was introduced; not yet reviewed for shortening."


[[exceptions]]
path = "crates/tui/src/config_center/forms/mod.rs"
ceiling = 601
reason = "One form per section of the configuration center, which settings_center/ replaces (S4 of docs/plan-settings-and-timeline.md); tui.scrollbackMouse's row (T1b) took it over the limit, and the exception goes with the module."

[[exceptions]]
path = "crates/tui/src/config_center/forms/mod.rs"
function = "section_form"
ceiling = 207
reason = "An exhaustive dispatch over the configuration center's sections, one form each, which settings_center/ replaces (S4); tui.scrollbackMouse's row (T1b) took it over the limit, and the exception goes with the module."
