# The third-party code in the sources, checked by `cargo xtask
# check-notices` (NOTICE, docs/extraction-plan.md §9, "Licence checklist").
#
# `[[derived]]`: code derived from another project. `path` is a Rust file or
# a directory (every `.rs` file under it, recursively); each file carries
# `marker` in its leading comment block, and NOTICE names `notice` (in
# backquotes). `[[mit]]`: a file that also keeps the MIT header of the
# project it derives from (`holder` is one of its copyright lines); NOTICE
# names its path. `[[original]]`: a file under a derived directory that is
# not derived, with why; it carries no marker. Snapshot files are generated
# from the tests and not checked.
version = 1

