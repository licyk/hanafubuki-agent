[package]
name = "xtask"
description = "Repository tasks for hanafubuki-agent: architecture checks, version bumps and release tags"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }
toml = "1.1"
toml_edit = "0.25"
