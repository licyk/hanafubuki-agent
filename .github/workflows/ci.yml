# The workspace's checks. A change only to files no check reads (Markdown, licence files, the documentation site that
# site.yml checks) runs nothing here. Tags never start this workflow: a v* tag starts Release, which reuses this
# workflow's run of the tagged commit, or calls this file as its checks when there is none.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "site/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/site.yml"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
      - "site/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push cancels an older run of the same ref. Inside a calling workflow, github.workflow is the caller's
# name, so its call never shares a group with (or cancels) a CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A run takes 8 to 18 minutes, a cold macOS build alone about 10: a hang fails instead of holding the runner.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      # keep in step with rust-toolchain.toml; the WASM example plugin is built for wasm32 in the tests
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo xtask check
      # The tests' temporary directories on Windows go to the runner's local disk (D:): on the system disk (C:) each
      # flush of the Agent's durable writes takes up to seconds, which held turns, cancellations and the tests' waits past
      # their deadlines. Writable to the user itself, as a profile's temporary directory is: D: grants it only through
      # Administrators, which the Windows sandbox's unelevated token lacks.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $temp = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP tests)
          icacls $temp /grant "${env:USERNAME}:(OI)(CI)F" | Out-Null
          "TEMP=$temp", "TMP=$temp" | Add-Content -Path $env:GITHUB_ENV
      - run: cargo test --workspace --all-features --no-fail-fast
