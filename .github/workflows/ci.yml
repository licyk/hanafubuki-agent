# The workspace's checks. A change only to files no check reads (Markdown, licence files) runs nothing here.
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push cancels an older run of the same ref. Inside a calling workflow, github.workflow is the caller's
# name, so its call never shares a group with (or cancels) a CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      # keep in step with rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --all-features
        env:
          RUSTFLAGS: -D warnings
      - run: cargo xtask check
      - run: cargo test --workspace --all-features
