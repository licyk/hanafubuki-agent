# The documentation site's checks and build (`site/`, the Bun workspace at the root). It builds for GitHub Pages,
# under the repository's path; a push to main (or a manual run on it) then deploys the build to Pages.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "patches/**"
      - "package.json"
      - "bun.lock"
      - ".prettierrc.json"
      - ".prettierignore"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push cancels an older pull-request run; a deploy from main is never cut off half-way.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # keep in step with packageManager in package.json
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run format:check:site
      - run: bun run site:check
      - run: bun run site:test
      - run: bun run site:build
        env:
          VITE_BASE_PATH: /hanafubuki-agent/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: site/.output/public
          include-hidden-files: true
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
