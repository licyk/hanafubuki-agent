[package]
name = "hello-wasm"
version = "0.1.0"
edition = "2021"
publish = false

# A WebAssembly module: build it with `--target wasm32-unknown-unknown`.
[lib]
crate-type = ["cdylib"]

[dependencies]
# The guest SDK, under MIT OR Apache-2.0: the plugin chooses its own licence.
kardia-guest = "0.2.3"

[profile.release]
opt-level = "s"
lto = true
